name: Android Debug Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Assemble debug APK
        run: gradle :app:assembleDebug

      - name: Rename APK asset
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/splitter-debug.apk

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: splitter-debug-apk
          path: app/build/outputs/apk/debug/splitter-debug.apk
          if-no-files-found: error

      - name: Publish debug prerelease
        uses: ncipollo/release-action@v1
        with:
          tag: debug-latest
          name: Splitter Debug APK
          body: |
            Latest informal debug APK build for Splitter.

            This release is updated automatically from the `main` branch workflow.
          prerelease: true
          allowUpdates: true
          replacesArtifacts: true
          artifacts: app/build/outputs/apk/debug/splitter-debug.apk
